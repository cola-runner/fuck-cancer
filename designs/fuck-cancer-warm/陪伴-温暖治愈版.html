<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>陪伴 · 病程管理（温暖治愈版）</title>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <style>
      :root {
        --bg: #F4EEE6;
        --canvas: #EFE7DC;
        --surface: #FFFFFF;
        --surface-2: #FBF7F1;
        --ink: #2D2823;
        --ink-2: #7C7468;
        --ink-3: #ABA294;
        --line: #ECE3D7;
        --line-2: #F3ECE2;

        --sage: #5E9081;
        --sage-strong: #4C7A6B;
        --sage-tint: #E5EFEA;
        --sage-tint-2: #EFF5F2;

        --coral: #E68A6F;
        --coral-strong: #D7745A;
        --coral-tint: #FAE8E0;

        --official: #5C7E9B;
        --official-tint: #E8F0F6;
        --amber: #BF8C3E;
        --amber-tint: #F5EAD4;
        --clay: #C0644B;
        --clay-tint: #F6E1D9;

        --shadow-sm: 0 1px 2px rgba(64,50,36,.06);
        --shadow-md: 0 8px 24px rgba(64,50,36,.09);
        --shadow-lg: 0 20px 48px rgba(64,50,36,.14);
        --shadow-coral: 0 10px 26px rgba(214,116,90,.32);
        --shadow-sage: 0 10px 26px rgba(76,122,107,.30);

        --r-xl: 26px;
        --r-lg: 22px;
        --r-md: 16px;
        --r-sm: 11px;

        --font-display: ui-rounded, "SF Pro Rounded", -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
        --font-body: -apple-system, "SF Pro Text", BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        font-family: var(--font-body);
        background:
          radial-gradient(1200px 600px at 50% -10%, #FBF4EA 0%, rgba(251,244,234,0) 60%),
          var(--canvas);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        display: flex;
        justify-content: center;
        min-height: 100dvh;
      }

      /* App frame — a calm, focused column that reads as "an app", not a dashboard */
      .phone {
        width: 100%;
        max-width: 452px;
        min-height: 100dvh;
        background: var(--bg);
        position: relative;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-lg);
        overflow: hidden;
      }
      @media (min-width: 480px) {
        .phone { min-height: min(940px, 100dvh); margin: auto; border-radius: 34px; }
      }

      .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
      .scroll::-webkit-scrollbar { width: 0; }

      /* lang tagging helps CJK line-breaking + line-height */
      [lang="zh"] { line-height: 1.78; }
      .lat { font-family: var(--font-body); }

      /* ---- Top bar ---- */
      .topbar {
        display: flex; align-items: center; gap: 12px;
        padding: 18px 22px 12px;
        background: linear-gradient(180deg, var(--bg) 70%, rgba(244,238,230,0));
      }
      .topbar h1 { font-family: var(--font-display); font-weight: 600; letter-spacing: -.2px; }
      .iconbtn {
        width: 40px; height: 40px; border: none; border-radius: 50%;
        background: var(--surface); color: var(--ink);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; box-shadow: var(--shadow-sm); flex-shrink: 0;
        transition: transform .15s ease, background .15s ease;
      }
      .iconbtn:active { transform: scale(.93); }
      .iconbtn:hover { background: var(--surface-2); }

      /* ---- Cards ---- */
      .card {
        background: var(--surface);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--line-2);
      }

      .chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 11px; border-radius: 999px;
        font-size: 12.5px; font-weight: 600; line-height: 1;
      }
      .chip-sage { background: var(--sage-tint); color: var(--sage-strong); }
      .chip-official { background: var(--official-tint); color: var(--official); }
      .chip-amber { background: var(--amber-tint); color: var(--amber); }
      .chip-clay { background: var(--clay-tint); color: var(--clay); }
      .chip-coral { background: var(--coral-tint); color: var(--coral-strong); }

      .btn {
        font-family: var(--font-body);
        border: none; cursor: pointer; border-radius: 999px;
        font-weight: 600; font-size: 15.5px;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        transition: transform .14s ease, box-shadow .2s ease, background .2s ease;
      }
      .btn:active { transform: translateY(1px) scale(.99); }
      .btn-primary { background: var(--sage); color: #fff; box-shadow: var(--shadow-sage); height: 54px; padding: 0 22px; }
      .btn-primary:hover { background: var(--sage-strong); }
      .btn-coral { background: var(--coral); color: #fff; box-shadow: var(--shadow-coral); }
      .btn-coral:hover { background: var(--coral-strong); }
      .btn-ghost { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); height: 46px; padding: 0 18px; }

      .muted { color: var(--ink-2); }
      .faint { color: var(--ink-3); }

      .fab {
        position: absolute; right: 20px; bottom: 24px;
        width: 60px; height: 60px; border-radius: 50%;
        background: var(--coral); color: #fff; border: none; cursor: pointer;
        box-shadow: var(--shadow-coral);
        display: flex; align-items: center; justify-content: center;
        transition: transform .16s ease;
        z-index: 30;
      }
      .fab:active { transform: scale(.92) rotate(90deg); }

      /* soft entrance */
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .rise { animation: rise .42s cubic-bezier(.2,.7,.3,1) both; }

      @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
      .dot-pulse { animation: pulse 1.4s ease-in-out infinite; }

      /* chat bubbles */
      .bubble-user {
        background: var(--sage); color: #fff;
        padding: 13px 16px; border-radius: 20px 20px 6px 20px;
        max-width: 82%; align-self: flex-end; font-size: 15.5px; line-height: 1.6;
        box-shadow: var(--shadow-sage);
      }
      .answer {
        background: var(--surface); border: 1px solid var(--line-2);
        border-radius: 6px 20px 20px 20px; padding: 18px 18px 16px;
        box-shadow: var(--shadow-sm); align-self: flex-start; max-width: 94%;
      }
      .cite {
        display: flex; gap: 11px; padding: 12px 13px;
        background: var(--surface-2); border: 1px solid var(--line);
        border-radius: 14px; cursor: pointer; text-align: left; width: 100%;
        transition: border-color .15s ease, transform .14s ease, box-shadow .2s ease;
      }
      .cite:hover { border-color: var(--official); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
      .cite-num {
        flex-shrink: 0; width: 22px; height: 22px; border-radius: 7px;
        background: var(--official); color: #fff; font-size: 12px; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-body);
      }

      .qchip {
        border: 1px solid var(--line); background: var(--surface);
        color: var(--ink); border-radius: 999px; padding: 9px 15px;
        font-size: 13.5px; cursor: pointer; white-space: nowrap;
        transition: background .15s ease, border-color .15s ease;
      }
      .qchip:hover { background: var(--sage-tint-2); border-color: var(--sage); }

      .inputbar {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
        background: var(--bg); border-top: 1px solid var(--line);
      }
      .inputbar input {
        flex: 1; border: none; background: var(--surface); border-radius: 999px;
        height: 48px; padding: 0 18px; font-size: 15.5px; font-family: var(--font-body);
        color: var(--ink); box-shadow: var(--shadow-sm); outline: none;
      }
      .inputbar input::placeholder { color: var(--ink-3); }

      .send {
        width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
        background: var(--sage); color: #fff; display: flex; align-items: center; justify-content: center;
        box-shadow: var(--shadow-sage); flex-shrink: 0;
      }

      /* doc row icon tile */
      .tile {
        width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
      }

      .seg {
        display: flex; gap: 4px; background: var(--surface-2);
        border: 1px solid var(--line); border-radius: 999px; padding: 4px;
      }
      .seg button {
        border: none; background: transparent; cursor: pointer;
        font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--ink-2);
        padding: 7px 14px; border-radius: 999px; transition: all .15s ease;
      }
      .seg button[data-on="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

      .divider { height: 1px; background: var(--line); border: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
<script type="text/babel" data-presets="react">
// Line icons — soft 1.7 stroke, rounded caps. Shared via window.
const Ic = ({ d, size = 22, s = 1.7, fill = "none", stroke = "currentColor", children, style }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={stroke}
       strokeWidth={s} strokeLinecap="round" strokeLinejoin="round" style={style}>
    {d ? <path d={d} /> : children}
  </svg>
);

const IconBack = (p) => <Ic {...p} d="M15 19l-7-7 7-7" s={2.2} />;
const IconPlus = (p) => <Ic {...p} d="M12 5v14M5 12h14" s={2.2} />;
const IconChevron = (p) => <Ic {...p} d="M9 5l7 7-7 7" s={2.2} />;
const IconHeart = (p) => <Ic {...p} d="M12 20.5C5 16 3 12.5 3 9.2 3 6.6 5 5 7.2 5c1.7 0 3 .9 3.8 2.2C11.8 5.9 13.1 5 14.8 5 17 5 19 6.6 19 9.2c0 3.3-2 6.8-7 11.3z" />;
const IconDoc = (p) => <Ic {...p} d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5zM14 3v5h5" />;

    <path d="M12 8.7v6.6" />
  </Ic>
);
const IconGlobe = (p) => (
  <Ic {...p}>
    <circle cx="12" cy="12" r="9" />
    <path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18" />
  </Ic>
);
const IconSpark = (p) => (
  <Ic {...p} d="M12 3l1.8 4.9L18.8 9.7 13.8 11.5 12 16.4 10.2 11.5 5.2 9.7 10.2 7.9z" />

const IconSearch = (p) => (
  <Ic {...p}>
    <circle cx="11" cy="11" r="7" />
    <path d="M20 20l-3.2-3.2" />
  </Ic>
);
const IconSend = (p) => <Ic {...p} d="M5 12l14-7-5 7 5 7-14-7z" s={1.6} />;
const IconCheck = (p) => <Ic {...p} d="M5 12.5l4.5 4.5L19 7" s={2.2} />;

const IconShield = (p) => (
  <Ic {...p}>

    <path d="M9 12l2 2 4-4" s={1.6} />
  </Ic>
);
const IconLeaf = (p) => <Ic {...p} d="M5 19c0-7 5-13 14-13 0 9-6 14-14 13zM5 19c3-3 5-5 8-6.5" />;
const IconUser = (p) => (
  <Ic {...p}>
    <circle cx="12" cy="8" r="4" />
    <path d="M5 20c1.2-3.6 4-5 7-5s5.8 1.4 7 5" />
  </Ic>
);

Object.assign(window, {
  IconBack, IconPlus, IconChevron, IconHeart, IconDoc, IconPill, IconGlobe,
  IconSpark, IconSearch, IconSend, IconCheck, IconExternal, IconShield, IconLeaf, IconUser,
});


/* ───────── */

// Presentational screens. State lives in App (app.jsx); these take props.

/* ---------------- Cases list ---------------- */
function CasesScreen({ onOpen }) {
  return (
    <div className="screen" data-screen-label="病例列表">
      <div className="topbar" style={{ flexDirection: "column", alignItems: "stretch", gap: 4, paddingTop: 26 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
            <span style={{ color: "var(--sage)" }}><IconLeaf size={24} /></span>
            <h1 style={{ fontSize: 21 }} lang="zh">陪伴</h1>
          </div>
          <button className="iconbtn" aria-label="账户"><IconUser size={20} /></button>
        </div>
      </div>

      <div className="scroll" style={{ padding: "8px 22px 40px" }}>
        <p lang="zh" style={{ fontSize: 27, fontFamily: "var(--font-display)", fontWeight: 600, letterSpacing: "-.4px", lineHeight: 1.3, marginTop: 6 }}>
          你照顾的人，<br />我替你记着。
        </p>
        <p lang="zh" className="muted" style={{ fontSize: 15, marginTop: 10, marginBottom: 22 }}>

        {CASES.map((c, i) => (
          <button

              {c.name[0]}

            <div style={{ flex: 1, minWidth: 0 }}>

/* ---------------- Document row ---------------- */
function DocRow({ d, delay }) {
  const isOfficial = d.kind === "official";
  const tileBg = d.kind === "note" ? "var(--sage-tint)" : "var(--official-tint)";
  const tileColor = d.kind === "note" ? "var(--sage-strong)" : "var(--official)";
  return (
    <div className="card rise" style={{ padding: 15, marginBottom: 11, display: "flex", gap: 13, animationDelay: `${delay}ms` }}>
      <div className="tile" style={{ background: tileBg, color: tileColor }}>
        {d.kind === "note" ? <IconDoc size={22} /> : <IconPill size={22} />}
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10 }}>
          <span lang="zh" style={{ fontSize: 15.5, fontWeight: 600, lineHeight: 1.4 }}>{d.title}</span>
          {d.status === "processing"
            ? <span className="chip chip-amber dot-pulse" lang="zh" style={{ flexShrink: 0 }}>整理中</span>
            : isOfficial
              ? <span className="chip chip-official" lang="zh" style={{ flexShrink: 0 }}><IconShield size={12} /> 官方</span>
              : <span className="chip chip-sage" lang="zh" style={{ flexShrink: 0 }}><IconCheck size={12} /> 已就绪</span>}
        </div>

        {d.snippet && <p lang="zh" className="muted" style={{ fontSize: 13, marginTop: 6, lineHeight: 1.65,
          display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{d.snippet}</p>}

        {isOfficial && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
            <span lang="zh" className="faint" style={{ fontSize: 12.5 }}>{d.source}</span>
            <span className="faint" style={{ fontSize: 12 }}>·</span>
            <a className="lat" style={{ fontSize: 12.5, color: "var(--official)", fontWeight: 600, textDecoration: "none", display: "inline-flex", alignItems: "center", gap: 3 }}>
              查看原文 <IconExternal />
            </a>
          </div>
        )}
        {!isOfficial && <div lang="zh" className="faint" style={{ fontSize: 12.5, marginTop: 7 }}>{d.meta}</div>}
      </div>
    </div>
  );
}

/* ---------------- Case detail (HERO) ---------------- */
function DetailScreen({ caseItem, onBack, onChat }) {
  const notes = DOCS.filter((d) => d.kind === "note");
  const official = DOCS.filter((d) => d.kind === "official");
  return (
    <div className="screen" data-screen-label="病例详情">
      <div className="topbar">
        <button className="iconbtn" onClick={onBack} aria-label="返回"><IconBack size={20} /></button>
        <div style={{ flex: 1 }} />
        <button className="iconbtn" aria-label="更多" style={{ fontSize: 20 }}>⋯</button>
      </div>

      <div className="scroll" style={{ padding: "4px 22px 110px" }}>
        {/* patient header */}
        <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 8 }}>
          <div className="tile" style={{ width: 56, height: 56, background: "var(--sage-tint)", color: "var(--sage-strong)", fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 24, borderRadius: 18 }}>
            {caseItem.name[0]}
          </div>
          <div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8 }}>
              <h1 lang="zh" style={{ fontSize: 25, fontFamily: "var(--font-display)", fontWeight: 600 }}>{caseItem.name}</h1>
              <span lang="zh" className="faint" style={{ fontSize: 13 }}>{caseItem.relation}</span>
            </div>
            <div lang="zh" className="muted" style={{ fontSize: 14, marginTop: 1 }}>{caseItem.diagnosis}</div>
          </div>
        </div>

        {/* reassurance banner — the hero feature, framed as care */}
        <div className="rise" style={{
          background: "linear-gradient(135deg, var(--sage-tint) 0%, var(--sage-tint-2) 100%)",
          borderRadius: "var(--r-lg)", padding: "16px 17px", display: "flex", gap: 13, marginTop: 18, marginBottom: 26,
        }}>
          <div style={{ color: "var(--sage-strong)", flexShrink: 0, marginTop: 1 }}><IconShield size={26} /></div>
          <div>
            <div lang="zh" style={{ fontSize: 15, fontWeight: 600, color: "var(--sage-strong)" }}>已为你收集官方用药说明</div>
            <p lang="zh" style={{ fontSize: 13.5, color: "var(--sage-strong)", opacity: .9, marginTop: 3, lineHeight: 1.6 }}>
              上传出院记录后，我自动找到了卡培他滨、华法林的 FDA / DailyMed 权威说明书。问答时会引用原文，不会乱猜。
            </p>
          </div>
        </div>

        {/* your uploads */}
        <SectionLabel>你的资料</SectionLabel>
        {notes.map((d, i) => <DocRow key={d.id} d={d} delay={i * 60} />)}

        {/* auto-collected official */}
        <SectionLabel right={<span className="chip chip-official" lang="zh"><IconShield size={12} /> 自动整理</span>}>
          官方用药说明
        </SectionLabel>
        {official.map((d, i) => <DocRow key={d.id} d={d} delay={120 + i * 60} />)}
      </div>

      {/* sticky ask bar */}
      <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, padding: "10px 18px calc(16px + env(safe-area-inset-bottom))",
        background: "linear-gradient(180deg, rgba(244,238,230,0), var(--bg) 38%)" }}>
        <button className="btn btn-coral" style={{ width: "100%", height: 56 }} onClick={onChat} lang="zh">
          <IconSpark size={19} /> 问问 AI（基于以上资料）
        </button>
      </div>
    </div>
  );
}

function SectionLabel({ children, right }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "4px 2px 12px" }}>
      <span lang="zh" style={{ fontSize: 13, fontWeight: 700, color: "var(--ink-2)", letterSpacing: ".3px" }}>{children}</span>
      {right}
    </div>
  );
}

/* ---------------- Chat ---------------- */
function ChatScreen({ caseItem, onBack }) {
  return (
    <div className="screen" data-screen-label="AI 问答">
      <div className="topbar">
        <button className="iconbtn" onClick={onBack} aria-label="返回"><IconBack size={20} /></button>
        <div>
          <h1 lang="zh" style={{ fontSize: 17 }}>问问 AI</h1>
          <div lang="zh" className="faint" style={{ fontSize: 12 }}>基于 {caseItem.name} 的 {caseItem.docCount} 份资料</div>
        </div>
      </div>

      <div className="scroll" style={{ padding: "10px 18px 18px", display: "flex", flexDirection: "column", gap: 18 }}>
        {CHAT.map((m, i) =>
          m.role === "user"
            ? <div key={i} className="bubble-user rise" lang="zh">{m.text}</div>
            : <AnswerBlock key={i} m={m} />
        )}
      </div>

      {/* suggested + input */}
      <div style={{ padding: "0 16px 6px", display: "flex", gap: 8, overflowX: "auto" }}>
        {SUGGESTED.map((q) => <button key={q} className="qchip" lang="zh">{q}</button>)}
      </div>
      <div className="inputbar">
        <input lang="zh" placeholder="问问关于病情、用药的任何问题…" defaultValue="" />
        <button className="send" aria-label="发送"><IconSend size={20} /></button>
      </div>
    </div>
  );
}

function AnswerBlock({ m }) {
  return (
    <div className="rise" style={{ display: "flex", flexDirection: "column", gap: 12, alignSelf: "flex-start", maxWidth: "94%" }}>
      <div className="answer">
        {m.paras.map((p, i) => (
          <p key={i} lang="zh" style={{ fontSize: 15, lineHeight: 1.75, marginBottom: i < m.paras.length - 1 ? 11 : 0 }}>
            <strong style={{ color: "var(--coral-strong)" }}>{p.lead}</strong>{" "}
            <span style={{ color: "var(--ink)" }}>{p.rest}</span>
          </p>
        ))}
        <div style={{ display: "flex", gap: 8, alignItems: "flex-start", marginTop: 14, padding: "10px 12px", background: "var(--amber-tint)", borderRadius: 12 }}>
          <span style={{ color: "var(--amber)", flexShrink: 0, marginTop: 1 }}><IconHeart size={15} /></span>
          <span lang="zh" style={{ fontSize: 12.5, color: "var(--amber)", lineHeight: 1.55 }}>{m.note}</span>
        </div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <span lang="zh" className="faint" style={{ fontSize: 12, fontWeight: 700, marginLeft: 2 }}>
          来源 · {m.cites.length} 处官方说明书
        </span>
        {m.cites.map((c) => (
          <button key={c.n} className="cite">
            <span className="cite-num">{c.n}</span>
            <span style={{ minWidth: 0 }}>
              <span style={{ display: "flex", alignItems: "center", gap: 7 }}>
                <span lang="zh" style={{ fontSize: 13.5, fontWeight: 600 }}>{c.title}</span>
                <span lang="zh" className="chip chip-official" style={{ fontSize: 10.5, padding: "2px 7px" }}>{c.source}</span>
              </span>
              <span lang="zh" className="muted" style={{ display: "block", fontSize: 12.5, marginTop: 4, lineHeight: 1.6 }}>
                “{c.quote}”
              </span>
            </span>
          </button>
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { CasesScreen, DetailScreen, ChatScreen });


/* ───────── */

// App shell — owns navigation state and mounts to #root.

function App() {
  const [view, setView] = React.useState("cases"); // 'cases' | 'detail' | 'chat'
  const [active, setActive] = React.useState(CASES[0]);

  return (
    <div className="phone">
      {view === "cases" && (
        <CasesScreen onOpen={(c) => { setActive(c); setView("detail"); }} />
      )}
      {view === "detail" && (
        <DetailScreen
          caseItem={active}
          onBack={() => setView("cases")}
          onChat={() => setView("chat")}
        />
      )}
      {view === "chat" && (
        <ChatScreen caseItem={active} onBack={() => setView("detail")} />
      )}

      {/* upload FAB — only on the detail screen */}
      {view === "detail" && (
        <button className="fab" aria-label="添加资料"><IconPlus size={26} /></button>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

  </body>
</html>
