<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>陪伴 · 病程管理（温暖治愈版）</title>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <style>
      :root {
        --bg: #F4EEE6;
        --canvas: #EFE7DC;
        --surface: #FFFFFF;
        --surface-2: #FBF7F1;
        --ink: #2D2823;
        --ink-2: #7C7468;
        --ink-3: #ABA294;
        --line: #ECE3D7;
        --line-2: #F3ECE2;

        --sage: #5E9081;
        --sage-strong: #4C7A6B;
        --sage-tint: #E5EFEA;
        --sage-tint-2: #EFF5F2;

        --coral: #E68A6F;
        --coral-strong: #D7745A;
        --coral-tint: #FAE8E0;

        --official: #5C7E9B;
        --official-tint: #E8F0F6;
        --amber: #BF8C3E;
        --amber-tint: #F5EAD4;
        --clay: #C0644B;
        --clay-tint: #F6E1D9;

        --shadow-sm: 0 1px 2px rgba(64,50,36,.06);
        --shadow-md: 0 8px 24px rgba(64,50,36,.09);
        --shadow-lg: 0 20px 48px rgba(64,50,36,.14);
        --shadow-coral: 0 10px 26px rgba(214,116,90,.32);
        --shadow-sage: 0 10px 26px rgba(76,122,107,.30);

        --r-xl: 26px;
        --r-lg: 22px;
        --r-md: 16px;
        --r-sm: 11px;

        --font-display: ui-rounded, "SF Pro Rounded", -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
        --font-body: -apple-system, "SF Pro Text", BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        font-family: var(--font-body);
        background:
          radial-gradient(1200px 600px at 50% -10%, #FBF4EA 0%, rgba(251,244,234,0) 60%),
          var(--canvas);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        display: flex;
        justify-content: center;
        min-height: 100dvh;
      }

      /* App frame — a calm, focused column that reads as "an app", not a dashboard */
      .phone {
        width: 100%;
        max-width: 452px;
        min-height: 100dvh;
        background: var(--bg);
        position: relative;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-lg);
        overflow: hidden;
      }
      @media (min-width: 480px) {
        .phone { min-height: min(940px, 100dvh); margin: auto; border-radius: 34px; }
      }

      .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
      .scroll::-webkit-scrollbar { width: 0; }

      /* lang tagging helps CJK line-breaking + line-height */
      [lang="zh"] { line-height: 1.78; }
      .lat { font-family: var(--font-body); }

      /* ---- Top bar ---- */
      .topbar {
        display: flex; align-items: center; gap: 12px;
        padding: 18px 22px 12px;
        background: linear-gradient(180deg, var(--bg) 70%, rgba(244,238,230,0));
      }
      .topbar h1 { font-family: var(--font-display); font-weight: 600; letter-spacing: -.2px; }
      .iconbtn {
        width: 40px; height: 40px; border: none; border-radius: 50%;
        background: var(--surface); color: var(--ink);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; box-shadow: var(--shadow-sm); flex-shrink: 0;
        transition: transform .15s ease, background .15s ease;
      }
      .iconbtn:active { transform: scale(.93); }
      .iconbtn:hover { background: var(--surface-2); }

      /* ---- Cards ---- */
      .card {
        background: var(--surface);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--line-2);
      }

      .chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 11px; border-radius: 999px;
        font-size: 12.5px; font-weight: 600; line-height: 1;
      }
      .chip-sage { background: var(--sage-tint); color: var(--sage-strong); }
      .chip-official { background: var(--official-tint); color: var(--official); }
      .chip-amber { background: var(--amber-tint); color: var(--amber); }
      .chip-clay { background: var(--clay-tint); color: var(--clay); }
      .chip-coral { background: var(--coral-tint); color: var(--coral-strong); }

      .btn {
        font-family: var(--font-body);
        border: none; cursor: pointer; border-radius: 999px;
        font-weight: 600; font-size: 15.5px;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        transition: transform .14s ease, box-shadow .2s ease, background .2s ease;
      }
      .btn:active { transform: translateY(1px) scale(.99); }
      .btn-primary { background: var(--sage); color: #fff; box-shadow: var(--shadow-sage); height: 54px; padding: 0 22px; }
      .btn-primary:hover { background: var(--sage-strong); }
      .btn-coral { background: var(--coral); color: #fff; box-shadow: var(--shadow-coral); }
      .btn-coral:hover { background: var(--coral-strong); }
      .btn-ghost { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); height: 46px; padding: 0 18px; }

      .muted { color: var(--ink-2); }
      .faint { color: var(--ink-3); }

      .fab {
        position: absolute; right: 20px; bottom: 24px;
        width: 60px; height: 60px; border-radius: 50%;
        background: var(--coral); color: #fff; border: none; cursor: pointer;
        box-shadow: var(--shadow-coral);
        display: flex; align-items: center; justify-content: center;
        transition: transform .16s ease;
        z-index: 30;
      }
      .fab:active { transform: scale(.92) rotate(90deg); }

      /* soft entrance */
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      .rise { animation: rise .42s cubic-bezier(.2,.7,.3,1) both; }

      @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
      .dot-pulse { animation: pulse 1.4s ease-in-out infinite; }

      /* chat bubbles */
      .bubble-user {
        background: var(--sage); color: #fff;
        padding: 13px 16px; border-radius: 20px 20px 6px 20px;
        max-width: 82%; align-self: flex-end; font-size: 15.5px; line-height: 1.6;
        box-shadow: var(--shadow-sage);
      }
      .answer {
        background: var(--surface); border: 1px solid var(--line-2);
        border-radius: 6px 20px 20px 20px; padding: 18px 18px 16px;
        box-shadow: var(--shadow-sm); align-self: flex-start; max-width: 94%;
      }
      .cite {
        display: flex; gap: 11px; padding: 12px 13px;
        background: var(--surface-2); border: 1px solid var(--line);
        border-radius: 14px; cursor: pointer; text-align: left; width: 100%;
        transition: border-color .15s ease, transform .14s ease, box-shadow .2s ease;
      }
      .cite:hover { border-color: var(--official); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
      .cite-num {
        flex-shrink: 0; width: 22px; height: 22px; border-radius: 7px;
        background: var(--official); color: #fff; font-size: 12px; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
        font-family: var(--font-body);
      }

      .qchip {
        border: 1px solid var(--line); background: var(--surface);
        color: var(--ink); border-radius: 999px; padding: 9px 15px;
        font-size: 13.5px; cursor: pointer; white-space: nowrap;
        transition: background .15s ease, border-color .15s ease;
      }
      .qchip:hover { background: var(--sage-tint-2); border-color: var(--sage); }

      .inputbar {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
        background: var(--bg); border-top: 1px solid var(--line);
      }
      .inputbar input {
        flex: 1; border: none; background: var(--surface); border-radius: 999px;
        height: 48px; padding: 0 18px; font-size: 15.5px; font-family: var(--font-body);
        color: var(--ink); box-shadow: var(--shadow-sm); outline: none;
      }
      .inputbar input::placeholder { color: var(--ink-3); }

      .send {
        width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
        background: var(--sage); color: #fff; display: flex; align-items: center; justify-content: center;
        box-shadow: var(--shadow-sage); flex-shrink: 0;
      }

      /* doc row icon tile */
      .tile {
        width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
      }

      .seg {
        display: flex; gap: 4px; background: var(--surface-2);
        border: 1px solid var(--line); border-radius: 999px; padding: 4px;
      }
      .seg button {
        border: none; background: transparent; cursor: pointer;
        font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--ink-2);
        padding: 7px 14px; border-radius: 999px; transition: all .15s ease;
      }
      .seg button[data-on="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

      .divider { height: 1px; background: var(--line); border: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="icons.jsx"></script>
    <script type="text/babel" src="data.jsx"></script>
    <script type="text/babel" src="screens.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>
